name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # A [sources] entry in a registered package's Project.toml points at a path that exists only
  # in this repository, so it must not reach main. It is the ordinary way to work on a branch,
  # where the solvers are built against the PureQPBase beside them rather than the released
  # one; the test environments carry that link permanently and are not registered, which is
  # what keeps the suites running against this checkout without it.
  sources:
    name: No path sources in the registered packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Project.toml
        run: |
          status=0
          for p in PureQPBase PureOSQP PureIPM PureDAQP; do
            if grep -q '^\[sources\]' "$p/Project.toml"; then
              echo "::error file=$p/Project.toml::[sources] must be removed before merging to main"
              status=1
            fi
          done
          exit $status

  # One job per package, so a package is reported on its own evidence. A base change that
  # every solver depends on used to fail all four suites in one job and say nothing about
  # which of them the change actually broke.
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [PureQPBase, PureIPM, PureDAQP, PureOSQP]
        version: ['1.12', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # The solvers' own Project.toml names a released PureQPBase, because that is what a
      # caller installs and the registered package must not carry a path into this
      # repository. In this checkout the base beside them is the one under test, and a
      # version bound naming a release that has not been registered yet cannot be satisfied
      # from the registry at all -- which held every solver's suite hostage to the base's
      # registration, so the change was only ever tested after it shipped.
      #
      # Developing it in writes a [sources] entry into the working copy. It never reaches a
      # commit: the `sources` job checks the committed file from its own checkout.
      - name: Take PureQPBase from this checkout
        if: matrix.package != 'PureQPBase'
        run: julia --project=${{ matrix.package }} -e 'using Pkg; Pkg.develop(path="PureQPBase")'
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ matrix.package }}
      # `check_bounds: yes` is `julia-runtest`'s own default, and is stated here because the
      # suites are the safety net for the `@inbounds` in the hot paths: forced bounds checking
      # neutralizes every one of them, so an index that escaped its range raises a
      # `BoundsError` here rather than reading whatever it reaches. An upstream default that
      # changed would take that net away without a line of this file changing.
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ matrix.package }}
          check_bounds: 'yes'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: PureOSQP/src,PureOSQP/ext,PureQPBase/src,PureQPBase/ext,PureIPM/src,PureIPM/ext,PureDAQP/src
      # Each job covers the lines its own suite reached, so the report is only complete once
      # all of them have been added to the same build.
      - uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.package }}-${{ matrix.version }}
          parallel: true

  coverage:
    name: Coverage
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
