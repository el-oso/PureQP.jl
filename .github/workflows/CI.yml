name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # A [sources] entry in a registered package's Project.toml points at a path that exists only
  # in this repository, so it must not reach main. It is the ordinary way to work on a branch,
  # where the solvers are built against the PureQPBase beside them rather than the released
  # one; the test environments carry that link permanently and are not registered, which is
  # what keeps the suites running against this checkout without it.
  sources:
    name: No path sources in the registered packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Project.toml
        run: |
          status=0
          for p in PureQPBase PureOSQP PureIPM PureDAQP; do
            if grep -q '^\[sources\]' "$p/Project.toml"; then
              echo "::error file=$p/Project.toml::[sources] must be removed before merging to main"
              status=1
            fi
          done
          exit $status

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # Each package is tested on its own first: PureQPBase that it holds no algorithm and its
      # backends work, PureIPM the interior-point method with nothing else loaded. PureOSQP
      # then runs the operator-splitting suite and everything that compares the two, so its
      # test environment takes the other packages from this checkout.
      # The solvers depend on the released PureQPBase, so their Project.toml names no path to
      # it. Without this each suite below would run against whatever version the registry
      # serves, and a change to the base in this checkout would go untested until after it was
      # released. Developing it into each environment restores that without a [sources] entry
      # that would travel into the registered package.
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: PureQPBase
      # `check_bounds: yes` is `julia-runtest`'s own default, and is stated here because the
      # suites are the safety net for the `@inbounds` in the hot paths: forced bounds checking
      # neutralizes every one of them, so an index that escaped its range raises a
      # `BoundsError` here rather than reading whatever it reaches. An upstream default that
      # changed would take that net away without a line of this file changing.
      - uses: julia-actions/julia-runtest@v1
        with:
          project: PureQPBase
          check_bounds: 'yes'
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: PureIPM
      - uses: julia-actions/julia-runtest@v1
        with:
          project: PureIPM
          check_bounds: 'yes'
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: PureDAQP
      - uses: julia-actions/julia-runtest@v1
        with:
          project: PureDAQP
          check_bounds: 'yes'
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: PureOSQP
      - uses: julia-actions/julia-runtest@v1
        with:
          project: PureOSQP
          check_bounds: 'yes'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: PureOSQP/src,PureOSQP/ext,PureQPBase/src,PureQPBase/ext,PureIPM/src,PureIPM/ext,PureDAQP/src
      - uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
