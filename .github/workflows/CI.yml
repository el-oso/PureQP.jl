name: CI
# `BACKLOG.md` and `CHANGELOG.md` are not pages of the docs build and no job reads them, so a
# change to either builds and tests nothing new. Every other path runs the full matrix,
# `docs/` included.
on:
  push:
    branches: [main]
    tags: ['*']
    paths-ignore: ['BACKLOG.md', 'CHANGELOG.md']
  pull_request:
    paths-ignore: ['BACKLOG.md', 'CHANGELOG.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # A [sources] entry in a registered package's Project.toml points at a path that exists
  # only in this repository, so it must not reach a release. Nothing needs one: the
  # repository is a Pkg workspace and its members resolve each other from the checkout, so
  # this is an invariant rather than a cleanup step, and an entry appearing here means a
  # resolver wrote one back.
  sources:
    name: No path sources in the registered packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Project.toml
        run: |
          status=0
          for p in PureQPBase PureOSQP PureIPM PureDAQP; do
            if grep -q '^\[sources\]' "$p/Project.toml"; then
              echo "::error file=$p/Project.toml::[sources] must be removed before merging to main"
              status=1
            fi
          done
          exit $status

  # One job per package, so a package is reported on its own evidence. A base change that
  # every solver depends on used to fail all four suites in one job and say nothing about
  # which of them the change actually broke.
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [PureQPBase, PureIPM, PureDAQP, PureOSQP]
        version: ['1.12', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # Nothing links the packages here. The repository is a Pkg workspace (see the root
      # Project.toml), so every member resolves the others from this checkout: a solver is
      # built against the PureQPBase beside it, whatever version bound it declares for the
      # release a caller installs.
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ matrix.package }}
      # `check_bounds: yes` is `julia-runtest`'s own default, and is stated here because the
      # suites are the safety net for the `@inbounds` in the hot paths: forced bounds checking
      # neutralizes every one of them, so an index that escaped its range raises a
      # `BoundsError` here rather than reading whatever it reaches. An upstream default that
      # changed would take that net away without a line of this file changing.
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ matrix.package }}
          check_bounds: 'yes'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: PureOSQP/src,PureOSQP/ext,PureQPBase/src,PureQPBase/ext,PureIPM/src,PureIPM/ext,PureDAQP/src
      # Each job covers the lines its own suite reached, so the report is only complete once
      # all of them have been added to the same build.
      - uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.package }}-${{ matrix.version }}
          parallel: true

  coverage:
    name: Coverage
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
