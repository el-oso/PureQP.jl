name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        description: Days of registry history to look back over
        default: "3"
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    # The comment trigger fires on every issue comment in the repository; only TagBot's own
    # are meant to do anything.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    strategy:
      # One job per package: each is registered separately and carries its own tag. Not
      # fail-fast, so a tag that cannot be made for one package does not stop the others.
      fail-fast: false
      matrix:
        subdir: [PureQPBase, PureOSQP, PureIPM, PureDAQP]
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Tags pushed with the deploy key trigger the workflows that watch for them, which a
          # push authenticated by GITHUB_TOKEN does not.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: ${{ matrix.subdir }}
